name: Bug report
description: Report a reproducible problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem clearly.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open the app...\n2. Connect...\n3. Observe the issue..."
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Windows, Python, Gear S3 model, and Tizen firmware.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs (remove private information)
      render: text
