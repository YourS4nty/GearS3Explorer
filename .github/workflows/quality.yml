name: Quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    name: Python syntax check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile project
        run: python -m compileall -q core ui main.py
